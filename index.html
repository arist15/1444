<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你像艺术是死里的谁</title>
<style>
  /* ===== 全局样式 ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: "Songti SC", "Noto Serif SC", "SimSun", "宋体", "FangSong", "仿宋", serif;
    background-color: #F7EEE1;
    color: #4A3A2A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* 页面容器 —— 尖角设计 */
  .app-container {
    width: 100%;
    max-width: 500px;
    background: rgba(255, 250, 240, 0.8);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 4px; /* 尖角风格：接近直角 */
    box-shadow: 0 20px 60px rgba(140, 110, 70, 0.12), 0 8px 24px rgba(140, 110, 70, 0.06);
    padding: 36px 26px 42px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255, 240, 220, 0.8);
  }

  /* 状态切换动画 */
  .state {
    display: none;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .state.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== 开始页 ===== */
  #startScreen {
    text-align: center;
    padding: 48px 0 32px;
  }

  .start-title {
    font-size: 28px;
    font-weight: bold;
    color: #5C4A3A;
    letter-spacing: 2px;
    line-height: 1.6;
    margin-bottom: 20px;
    animation: fadeInUp 1.8s ease forwards;
    opacity: 0;
  }

  .start-author {
    font-size: 15px;
    color: #9C8A78;
    letter-spacing: 2px;
    margin-bottom: 60px;
    animation: fadeInUp 1.8s ease 0.3s forwards;
    opacity: 0;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .start-btn {
    display: inline-block;
    padding: 16px 64px;
    font-size: 20px;
    font-family: inherit;
    color: #FFF8F0;
    background: linear-gradient(135deg, #C49A6C, #A87B4C);
    border: none;
    border-radius: 4px; /* 尖角 */
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(168, 123, 76, 0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    letter-spacing: 4px;
    opacity: 0;
    animation: fadeInUp 1.8s ease 0.8s forwards;
  }

  .start-btn:active {
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(168, 123, 76, 0.25);
  }

  /* ===== 答题页 ===== */
  #quizScreen {
    padding: 8px 0;
  }

  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 14px;
    color: #8A7A6A;
    letter-spacing: 1px;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(200, 180, 160, 0.25);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #C49A6C, #A87B4C);
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .question-text {
    font-size: 19px;
    line-height: 1.7;
    color: #4A3A2A;
    margin-bottom: 28px;
    min-height: 80px;
    letter-spacing: 0.5px;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    padding: 16px 20px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.5;
    color: #4A3A2A;
    background: rgba(255, 252, 245, 0.9);
    border: 1.5px solid rgba(200, 170, 140, 0.4);
    border-radius: 4px; /* 尖角 */
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 2px 8px rgba(140, 110, 70, 0.04);
  }

  .option-btn:active {
    background: rgba(240, 225, 200, 1);
    border-color: #C49A6C;
    transform: scale(0.98);
    box-shadow: 0 1px 4px rgba(140, 110, 70, 0.08);
  }

  .option-prefix {
    display: inline-block;
    width: 24px;
    font-weight: bold;
    color: #A87B4C;
    margin-right: 4px;
  }

  /* 答题页切换动画 */
  .quiz-fade {
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .quiz-fade.out {
    opacity: 0;
    transform: translateX(-16px);
  }

  /* ===== 结果页 ===== */
  #resultScreen {
    text-align: center;
    padding: 16px 0 8px;
  }

  .result-label {
    font-size: 14px;
    color: #8A7A6A;
    letter-spacing: 3px;
    margin-bottom: 12px;
  }

  .result-role {
    font-size: 40px;
    font-weight: bold;
    color: #5C4A3A;
    letter-spacing: 4px;
    margin-bottom: 20px;
    line-height: 1.4;
    background: linear-gradient(135deg, #8B6B4A, #A87B4C);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-desc {
    font-size: 15px;
    line-height: 1.9;
    color: #6A5A4A;
    text-align: justify;
    margin-bottom: 28px;
    padding: 0 4px;
    letter-spacing: 0.3px;
  }

  .percent-section {
    margin-bottom: 32px;
  }

  .percent-item {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
    color: #6A5A4A;
  }

  .percent-name {
    width: 80px;
    text-align: right;
    padding-right: 12px;
    flex-shrink: 0;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .percent-bar-track {
    flex: 1;
    height: 10px;
    background: rgba(200, 180, 160, 0.2);
    border-radius: 5px;
    overflow: hidden;
    margin-right: 10px;
  }

  .percent-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #D4B896, #A87B4C);
    border-radius: 5px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .percent-value {
    width: 44px;
    text-align: left;
    font-size: 13px;
    color: #8A7A6A;
    flex-shrink: 0;
  }

  .retry-btn {
    display: inline-block;
    padding: 14px 48px;
    font-size: 17px;
    font-family: inherit;
    color: #FFF8F0;
    background: linear-gradient(135deg, #C49A6C, #A87B4C);
    border: none;
    border-radius: 4px; /* 尖角 */
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(168, 123, 76, 0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    letter-spacing: 3px;
  }

  .retry-btn:active {
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(168, 123, 76, 0.25);
  }

  /* 结果页内容渐入 */
  .result-content {
    opacity: 0;
    animation: resultFadeIn 0.8s ease 0.2s forwards;
  }

  @keyframes resultFadeIn {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 小屏适配 */
  @media (max-width: 400px) {
    .app-container {
      padding: 26px 16px 34px;
      border-radius: 2px;
    }
    .start-title {
      font-size: 24px;
    }
    .result-role {
      font-size: 34px;
    }
    .question-text {
      font-size: 17px;
    }
    .option-btn {
      font-size: 15px;
      padding: 14px 16px;
    }
  }
</style>
</head>
<body>

<div class="app-container">

  <!-- ===== 开始页 ===== -->
  <div id="startScreen" class="state active">
    <div class="start-title">测测你像<br>艺术是死里的谁</div>
    <div class="start-author">@目非</div>
    <button class="start-btn" id="startBtn">开 始</button>
  </div>

  <!-- ===== 答题页 ===== -->
  <div id="quizScreen" class="state">
    <div class="quiz-header">
      <span id="progressText">第 1 题 / 共 15 题</span>
      <span id="percentText">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="quiz-fade" id="quizContent">
      <div class="question-text" id="questionText"></div>
      <div class="options-list" id="optionsList"></div>
    </div>
  </div>

  <!-- ===== 结果页 ===== -->
  <div id="resultScreen" class="state">
    <div class="result-content">
      <div class="result-label">你的测试结果</div>
      <div class="result-role" id="resultRole"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="percent-section" id="percentSection"></div>
      <button class="retry-btn" id="retryBtn">再测一次</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   数据定义
   ============================================================ */

/**
 * 题目数组
 * 每道题包含：
 *   text: 题目文本
 *   options: 选项数组，每个选项有 text 和 scores
 *   scores: 该选项给哪个角色加分
 * 角色 key 映射：
 *   spring  → 春城留声
 *   winter  → 冬鸠
 *   autumn  → 空庭安久乐
 *   wind    → 风月院岚
 */
const questions = [
  {
    text: "周末你更愿意怎么度过？",
    options: [
      { text: "一个人待在家里，刷手机睡大觉。", scores: { spring: 1 } },
      { text: "出门乱转，参加活动、约会。", scores: { winter: 1 } },
      { text: "做一直想但始终没做的事，处理好积压的事务。", scores: { autumn: 1 } },
      { text: "和亲近的人待在一起，制定好下周的计划安排。", scores: { wind: 1 } }
    ]
  },
  {
    text: "身处陌生的集会，你的状态是？",
    options: [
      { text: "好吓人，等到合适的时机就开溜。", scores: { spring: 1 } },
      { text: "找个合眼缘的人搭话，希望交到新朋友。", scores: { winter: 1 } },
      { text: "四处走走熟悉环境，安静地观察着这一切。", scores: { autumn: 1 } },
      { text: "主动挑起话题，早就自然而然融入其中。", scores: { wind: 1 } }
    ]
  },
  {
    text: "你更害怕哪种情况发生？",
    options: [
      { text: "永远不合群，被他人远远甩在身后。", scores: { spring: 1 } },
      { text: "变得无聊，被最亲近的人否定一切。", scores: { winter: 1 } },
      { text: "做出违心的事，不知不觉活成令自己讨厌的样子。", scores: { autumn: 1 } },
      { text: "失去控制，精心制定的计划被意外打乱。", scores: { wind: 1 } }
    ]
  },
  {
    text: "遇到令你痛苦的事，你会？",
    options: [
      { text: "全部憋在心里，等这一阵情绪过去。", scores: { spring: 1 } },
      { text: "转移注意力，努力寻找有趣的事物填满自己。", scores: { winter: 1 } },
      { text: "纠结为什么会这样，反复复盘寻求解释。", scores: { autumn: 1 } },
      { text: "该做什么做什么，尽量不让别人看出来。", scores: { wind: 1 } }
    ]
  },
  {
    text: "你平时更常听到别人怎么评价你？",
    options: [
      { text: "沉默寡言，要是能多说说话就好了。", scores: { spring: 1 } },
      { text: "和你在一起总是很开心。", scores: { winter: 1 } },
      { text: "你是一个有主见、有原则的人。", scores: { autumn: 1 } },
      { text: "看起来很温和，但总觉得难以接近。", scores: { wind: 1 } }
    ]
  },
  {
    text: "你买东西时更看重？",
    options: [
      { text: "实用，耐用，平平淡淡才是真。", scores: { spring: 1 } },
      { text: "情绪价值和趣味性，自己怎么开心怎么来。", scores: { winter: 1 } },
      { text: "性价比，以及是否真的需要。", scores: { autumn: 1 } },
      { text: "品质品牌，物品本身于自己而言的价值。", scores: { wind: 1 } }
    ]
  },
  {
    text: "如果有人与你理念不合，你会？",
    options: [
      { text: "表面不多说什么，但心中记下，之后默默远离对方。", scores: { spring: 1 } },
      { text: "维持体面，用玩笑和插科打诨先把话题带过去，装作无事发生。", scores: { winter: 1 } },
      { text: "当面提出问题和对方辩清楚，直到分出对错。", scores: { autumn: 1 } },
      { text: "不急着反驳，先观察对方的态度再做判断，能拉拢就尝试拉拢。", scores: { wind: 1 } }
    ]
  },
  {
    text: "你认为一场演出最重要的是？",
    options: [
      { text: "表演者的演技如何。", scores: { spring: 1 } },
      { text: "演出气氛与台下观众的反馈。", scores: { winter: 1 } },
      { text: "整场演出是否经得起推敲。", scores: { autumn: 1 } },
      { text: "演出是否能顺利呈现。", scores: { wind: 1 } }
    ]
  },
  {
    text: "你平时的饮食习惯更接近？",
    options: [
      { text: "口味清淡，什么都吃。", scores: { spring: 1 } },
      { text: "偏好快餐类，对奶茶甜点也来者不拒。", scores: { winter: 1 } },
      { text: "健康饮食，偶尔喝咖啡饮料提神。", scores: { autumn: 1 } },
      { text: "对吃有一定要求，不能太随便。", scores: { wind: 1 } }
    ]
  },
  {
    text: "你更喜欢以下哪句话？",
    options: [
      { text: "我一口吞下苦涩的命运，抬头看天，生命一贫如洗，死亡却如此丰盈。", scores: { spring: 1 } },
      { text: "我什么都不曾拥有，我什么都不曾失去，我一无所有，却拥有整个宇宙。", scores: { winter: 1 } },
      { text: "一切背离了公正的知识，都应叫作狡诈，而不应称为智慧。", scores: { autumn: 1 } },
      { text: "什么义理，什么规纪，尽是由人类随意决定，来羁禁我身的绳索罢了。", scores: { wind: 1 } }
    ]
  },
  {
    text: "有人和你说“人生是没有意义的”，你会如何回应？",
    options: [
      { text: "我无所谓。", scores: { spring: 1 } },
      { text: "闹麻了。", scores: { winter: 1 } },
      { text: "我会去创造意义。", scores: { autumn: 1 } },
      { text: "总归会有的。", scores: { wind: 1 } }
    ]
  },
  {
    text: "在亲密关系中，你更接近哪一种状态？",
    options: [
      { text: "对亲密感到不适，习惯保持情感距离。", scores: { spring: 1 } },
      { text: "需要持续的关注确认，害怕被抛弃。", scores: { winter: 1 } },
      { text: "既渴望亲密，又害怕亲密，摇摆不定。", scores: { autumn: 1 } },
      { text: "享受亲密，同时保持独立自我。", scores: { wind: 1 } }
    ]
  },
  {
    text: "你更喜欢哪一种结局？",
    options: [
      { text: "普通结局。", scores: { spring: 1 } },
      { text: "好结局。", scores: { winter: 1 } },
      { text: "真实结局。", scores: { autumn: 1 } },
      { text: "开放结局。", scores: { wind: 1 } }
    ]
  },
  {
    text: "在你看来，死亡更像一出戏里的？",
    options: [
      { text: "谢幕。", scores: { spring: 1 } },
      { text: "高潮。", scores: { winter: 1 } },
      { text: "换幕。", scores: { autumn: 1 } },
      { text: "预热。", scores: { wind: 1 } }
    ]
  },
  {
    text: "最后，有关艺术，你认为最重要的核心特征是什么？",
    options: [
      { text: "创造性。", scores: { spring: 1 } },
      { text: "表现性。", scores: { winter: 1 } },
      { text: "形象性。", scores: { autumn: 1 } },
      { text: "审美性。", scores: { wind: 1 } }
    ]
  }
];

/* 角色信息映射 */
const roleInfo = {
  spring: {
    name: "春城留声",
    desc: "你习惯把情绪压到最深处，不轻易让人看见。你曾经有过想站上的位置，却因为种种原因退了下来。你表面冷淡，内心却比谁都清楚自己的不甘、愧疚和执念。你可能会用沉默保护别人，也可能用沉默伤害自己。"
  },
  winter: {
    name: "冬鸠",
    desc: "你擅长用笑容和玩笑化解沉重。你经历过不少糟糕的事，于是学会把悲剧当成喜剧来讲。你相信笑声能掩盖很多东西，也相信荒诞本身就是一种真实。你渴望一个不会离开的搭档，也愿意把最疯狂的一面留给最信任的人。"
  },
  autumn: {
    name: "空庭安久乐",
    desc: "你认定一件事，就会一条路走到黑。你相信规则、证据和正确的事，也愿意为了这些付出代价。你不太擅长表达感情，关心别人的方式常常笨拙又固执。你可能会让人觉得不近人情，但你心里有一套极其坚定的标准。"
  },
  wind: {
    name: "风月院岚",
    desc: "你看起来温和、得体，实际上非常清楚自己要什么。你擅长布局，也愿意为了在乎的人或事做出常人难以接受的选择。你不相信虚无缥缈的东西，更相信自己的判断和手段。你的温柔是真的，你的危险也是真的。"
  }
};

/* ============================================================
   状态管理
   ============================================================ */
let currentQuestionIndex = 0;           // 当前题号（0 开始）
const totalQuestions = questions.length; // 总题数
let scores = { spring: 0, winter: 0, autumn: 0, wind: 0 }; // 各角色得分

/* ============================================================
   DOM 元素引用
   ============================================================ */
const startScreen = document.getElementById('startScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');

const startBtn = document.getElementById('startBtn');
const progressText = document.getElementById('progressText');
const percentText = document.getElementById('percentText');
const progressFill = document.getElementById('progressFill');
const questionText = document.getElementById('questionText');
const optionsList = document.getElementById('optionsList');
const quizContent = document.getElementById('quizContent');

const resultRole = document.getElementById('resultRole');
const resultDesc = document.getElementById('resultDesc');
const percentSection = document.getElementById('percentSection');
const retryBtn = document.getElementById('retryBtn');

/* ============================================================
   页面切换函数
   ============================================================ */
function switchState(fromEl, toEl) {
  fromEl.classList.remove('active');
  setTimeout(() => {
    toEl.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 200);
}

/* ============================================================
   答题逻辑
   ============================================================ */

/** 渲染当前题目 */
function renderQuestion() {
  const q = questions[currentQuestionIndex];

  // 更新进度显示
  const currentNum = currentQuestionIndex + 1;
  const progressPercent = Math.round((currentQuestionIndex / totalQuestions) * 100);
  progressText.textContent = `第 ${currentNum} 题 / 共 ${totalQuestions} 题`;
  percentText.textContent = `${progressPercent}%`;
  progressFill.style.width = `${progressPercent}%`;

  // 更新题目文本
  questionText.textContent = q.text;

  // 清空并生成选项
  optionsList.innerHTML = '';
  const prefixLetters = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-prefix">${prefixLetters[idx]}.</span>${opt.text}`;

    // 点击选项事件
    btn.addEventListener('click', () => handleOptionClick(opt.scores));

    optionsList.appendChild(btn);
  });
}

/** 处理选项点击 */
function handleOptionClick(optionScores) {
  // 1. 累加分数
  for (const key in optionScores) {
    if (scores.hasOwnProperty(key)) {
      scores[key] += optionScores[key];
    }
  }

  // 2. 播放切换动画后进入下一题或结果页
  quizContent.classList.add('out');

  setTimeout(() => {
    quizContent.classList.remove('out');
    currentQuestionIndex++;

    if (currentQuestionIndex < totalQuestions) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 350);
}

/* ============================================================
   结果计算与展示
   ============================================================ */

/** 计算最终结果并展示 */
function showResult() {
  // 1. 计算各角色百分比
  const totalScore = Object.values(scores).reduce((a, b) => a + b, 0) || 1;
  const percentages = {};
  for (const key in scores) {
    percentages[key] = Math.round((scores[key] / totalScore) * 100);
  }

  // 2. 找出最高分（处理并列情况）
  const maxScore = Math.max(...Object.values(scores));
  const topRoles = Object.keys(scores).filter(key => scores[key] === maxScore);

  // 3. 随机选择一项显示（并列时）
  const randomIndex = Math.floor(Math.random() * topRoles.length);
  const selectedRole = topRoles[randomIndex];

  // 4. 获取角色名称和描述
  const roleNameText = roleInfo[selectedRole].name;
  const descText = roleInfo[selectedRole].desc;

  // 5. 更新结果页 DOM
  resultRole.textContent = roleNameText;
  resultDesc.textContent = descText;

  // 6. 生成百分比条
  percentSection.innerHTML = '';
  const order = ['spring', 'winter', 'autumn', 'wind'];
  order.forEach(key => {
    const item = document.createElement('div');
    item.className = 'percent-item';

    const nameEl = document.createElement('div');
    nameEl.className = 'percent-name';
    nameEl.textContent = roleInfo[key].name;

    const trackEl = document.createElement('div');
    trackEl.className = 'percent-bar-track';

    const fillEl = document.createElement('div');
    fillEl.className = 'percent-bar-fill';
    fillEl.style.width = '0%';

    const valueEl = document.createElement('div');
    valueEl.className = 'percent-value';
    valueEl.textContent = `${percentages[key]}%`;

    trackEl.appendChild(fillEl);
    item.appendChild(nameEl);
    item.appendChild(trackEl);
    item.appendChild(valueEl);
    percentSection.appendChild(item);

    // 延迟设置宽度，触发过渡动画
    setTimeout(() => {
      fillEl.style.width = `${percentages[key]}%`;
    }, 100);
  });

  // 7. 切换到结果页
  switchState(quizScreen, resultScreen);
}

/* ============================================================
   重置逻辑
   ============================================================ */

/** 重置所有状态，回到开始页 */
function resetAll() {
  currentQuestionIndex = 0;
  scores = { spring: 0, winter: 0, autumn: 0, wind: 0 };

  resultRole.textContent = '';
  resultDesc.textContent = '';
  percentSection.innerHTML = '';

  progressFill.style.width = '0%';
  percentText.textContent = '0%';

  switchState(resultScreen, startScreen);
}

/* ============================================================
   事件绑定与初始化
   ============================================================ */

// 开始按钮
startBtn.addEventListener('click', () => {
  currentQuestionIndex = 0;
  scores = { spring: 0, winter: 0, autumn: 0, wind: 0 };

  switchState(startScreen, quizScreen);

  setTimeout(() => {
    renderQuestion();
  }, 300);
});

// 再测一次按钮
retryBtn.addEventListener('click', () => {
  resetAll();
});

/* 初始化 */
window.addEventListener('DOMContentLoaded', () => {
  startScreen.classList.add('active');
  quizScreen.classList.remove('active');
  resultScreen.classList.remove('active');
});

</script>
</body>
</html>
